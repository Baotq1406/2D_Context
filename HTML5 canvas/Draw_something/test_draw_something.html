<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center; /* căn giữa ngang */
            align-items: center;     /* căn giữa dọc */
        }

        canvas {
            border: 2px solid lightgrey;
        }
    </style>
</head>
<body>
<canvas id="canvas" width="750" height="400" style="border:2px solid lightgrey;">
    Your browser does not support the HTML5 canvas tag.
</canvas>
</body>
<script>
    "use strict";
    let canvas;
    let context;

    window.onload = init;

    function init(){
        // Get a reference to the canvas
        canvas = document.getElementById('canvas');
        context = canvas.getContext('2d');

        draw();
    }

    function draw() {
        // Get a random color, red or blue
        let randomColor = Math.random() > 0.5? '#ff8080' : '#0099b0';

        // Draw a rectangle
        context.fillStyle = randomColor;
        //context.fillRect(0, 0, 200, 175);
        context.fillRect(100, 50, 200, 175);

        // Draw circle beside rectangle
        context.beginPath();
        //context.arc(380, 100, 50, 0, 2 * Math.PI);

        // nửa vòng tròn phía dưới
        //context.arc(380, 100, 50, 0, Math.PI);

        // Nửa hình tròn phía trên
        //context.arc(380, 100, 50, Math.PI, 2 * Math.PI);  
        
        // 1/4 cung tròn muốn vẽ 1/4 hình tròn thì phải di chuyển đến tâm trước rồi mới vẽ cung tròn
        // context.arc(380, 100, 50, 0, Math.PI / 2);
        // context.fill();

        //1/4 hình tròn 
        // context.moveTo(380, 100);      // tâm

        // context.arc(
        //     380, 100,
        //     50,
        //     0,
        //     Math.PI / 2
        // );

        // context.closePath();
        // context.fill();

        //3/4 hình tròn, nhớ nhớ vẽ đúng cần có tâm hẹ hẹ 
        context.moveTo(380, 100);      // tâm
        context.arc(380, 100, 50, 0, 1.5 * Math.PI);
        context.closePath();
        context.fill();

        // vẽ line 
        context.beginPath();
        context.moveTo(315, 50);
        context.lineTo(315, 225);
        context.stroke();

        // vẽ tam giác
        context.beginPath();
        context.moveTo(100, 300);
        context.lineTo(200, 250);
        context.lineTo(200, 350);
        context.fill();
    }
</script>
</html>
